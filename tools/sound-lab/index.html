<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sound lab · Interval Timer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Sound lab</h1>
        <p class="lead">
          Tap a sound to hear it and select it. Then press <strong>Play sequence</strong> to hear
          your picks the way a workout plays them.
        </p>
      </header>

      <section class="toolbar" aria-label="Playback">
        <button type="button" id="sequence" class="primary">▶ Play sequence</button>
        <label class="volume">
          <input id="silent" type="checkbox" />
          Play in silent mode (pauses music)
        </label>
        <label class="volume">
          Volume
          <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8" />
        </label>
      </section>

      <div id="cues"></div>

      <section class="export" aria-labelledby="export-title">
        <h2 id="export-title">Your picks</h2>
        <p>Copy this and send it to Claude to put these sounds in the app.</p>
        <pre id="choice"></pre>
        <button type="button" id="copy">Copy</button>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
